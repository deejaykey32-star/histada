<style>
/* Świadomie jeden, nocny wygląd – wspólny mianownik trzech części: mapa, krąg, diament. */
:root{color-scheme:dark;--bg:#0a111d;--bg2:#0f1a2b;--line:#253754;--ink:#eee7d4;--muted:#9fabbe;--gold:#d9b25a;--gold2:#f0d48f;--teal:#2c8f99;--cyan:#38e8ff;--mag:#ff4fd8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--display:"Cinzel","Times New Roman",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(90% 60% at 50% 0%,#16274a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:40px 56px;display:flex;flex-direction:column;gap:44px}
header.top{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ava{width:150px;height:150px;border:none;background:none;padding:0;border-radius:50%;cursor:pointer;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.ava svg{width:100%;height:100%;display:block}
.eyebrow{font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{margin:6px 0 10px;font:700 clamp(34px,6vw,58px)/1.02 var(--display);letter-spacing:.08em;color:var(--gold2);text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--ink);font-size:17px}
.bubble{margin-top:14px;display:inline-flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--gold);border-radius:12px 12px 12px 3px;padding:9px 14px;font-size:14.5px;max-width:62ch}
.bubble b{font:700 12px var(--display);letter-spacing:.12em;color:var(--gold2)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--bg2);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stats b{font:600 26px var(--mono);font-variant-numeric:tabular-nums;color:var(--gold2)}
.stats span{font-size:13px;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.part.p4{border-top:3px solid #b8902c;background:#f4efe3;color:#15303a}.part.p4 h2{color:#15303a}.part.p4 p{color:#15303a}.part.p4 ul,.part.p4 .no{color:#5e6f76}.part.p4 .tag{color:#5e6f76;border-color:#d9d1bd}.part.p4 .go{background:#15303a;color:#f4efe3}
@media (max-width:1100px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.part{position:relative;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--bg2);min-height:100%}
.part .art{height:170px;position:relative;display:block}
.part .art svg{width:100%;height:100%;display:block}
.part .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.part .no{font:500 12px var(--mono);color:var(--muted);letter-spacing:.06em}
.part h2{margin:0;font:700 24px/1.15 var(--display);letter-spacing:.04em;text-wrap:balance}
.part p{margin:0;color:var(--ink);font-size:15px}
.part ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.part .meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:600 15px var(--sans);border-radius:8px;padding:11px 16px;border:1px solid transparent}
.p1{border-top:3px solid var(--teal)}.p1 h2{color:#8fd6dc}.p1 .go{background:#0d6c78;color:#fff}
.p2{border-top:3px solid var(--gold)}.p2 h2{color:var(--gold2)}.p2 .go{background:var(--gold);color:#1c1405}
.p3{border-top:3px solid var(--cyan);background:linear-gradient(#08122a,#070c19)}.p3 h2{color:#dff6ff;font-family:"Chakra Petch",var(--sans);letter-spacing:.14em;text-transform:uppercase;font-size:21px}.p3 .go{background:var(--cyan);color:#021018}
.go:hover{filter:brightness(1.1)}.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
section h3{margin:0 0 12px;font:700 20px var(--display);letter-spacing:.06em;color:var(--gold2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.ints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ints div{display:flex;gap:8px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg2)}
.ints svg{flex:none}
.flow{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.flow li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:15px}
.flow li::before{content:counter(s);font:700 15px var(--display);color:var(--bg);background:var(--gold);border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.note{font-size:13.5px;color:var(--muted);max-width:80ch;border-left:2px solid var(--line);padding-left:12px;margin:0}
footer{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:900px){.parts{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats div:last-child{grid-column:1/-1}}
@media (max-width:560px){header.top{grid-template-columns:1fr;justify-items:start}.ava{width:110px;height:110px}.ints{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* kontroler mimiki i gestów: HistadaFx(element z SVG) */
function HistadaFx(host) {
  const svg = host && host.querySelector('svg.hx');
  const noop = { mood() {}, gesture() {}, react() {}, look() {} };
  if (!svg) return noop;
  if (!document.getElementById('hx-css')) { const st = document.createElement('style'); st.id = 'hx-css'; st.textContent = HISTADA_CSS; document.head.appendChild(st); }
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOODS = ['happy', 'sad', 'think', 'wow'], GEST = { wave: 2200, point: 2400, think: 3200, clap: 1800, nod: 900, shake: 900 };
  let mT = null, gT = null, lastPtr = 0, busyUntil = 0;
  const cls = svg.classList;
  function mood(m, ms = 2800) {
    MOODS.forEach(x => cls.remove('m-' + x)); if (m) cls.add('m-' + m);
    clearTimeout(mT); if (m && ms) mT = setTimeout(() => mood(null), ms);
  }
  function gesture(gs) {
    if (RM || !GEST[gs]) return;
    Object.keys(GEST).forEach(x => cls.remove('g-' + x)); void svg.getBoundingClientRect(); cls.add('g-' + gs);
    busyUntil = performance.now() + GEST[gs];
    clearTimeout(gT); gT = setTimeout(() => cls.remove('g-' + gs), GEST[gs]);
  }
  function look(x, y) { svg.style.setProperty('--lx', x.toFixed(2) + 'px'); svg.style.setProperty('--ly', y.toFixed(2) + 'px'); }
  // gotowe reakcje na sytuacje w grze
  function react(kind) {
    switch (kind) {
      case 'hi': mood('happy', 2400); gesture('wave'); break;
      case 'ok': mood('happy', 2600); gesture(Math.random() < .6 ? 'clap' : 'nod'); break;
      case 'no': mood('sad', 2600); gesture('shake'); break;
      case 'q': mood('think', 0); if (Math.random() < .5) gesture('think'); break;
      case 'point': gesture('point'); break;
      case 'wow': mood('wow', 1800); break;
      case 'win': mood('happy', 4000); gesture('clap'); setTimeout(() => gesture('wave'), 1900); break;
      case 'calm': mood(null); break;
    }
  }
  if (!RM) {
    // oczy śledzą kursor
    let raf = 0, px = 0, py = 0;
    window.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; lastPtr = performance.now(); if (raf) return; raf = requestAnimationFrame(() => {
      raf = 0; if (cls.contains('m-think') || cls.contains('m-sad')) return;
      const r = host.getBoundingClientRect(); if (!r.width) return;
      const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height * .47), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);
      look(dx / d * 1.7 * k, dy / d * 1.3 * k); }); }, { passive: true });
    // życie w spoczynku: mruganie, rozglądanie się, przechylenie głowy
    const idle = () => {
      const now = performance.now();
      if (!document.hidden && now > busyUntil) {
        const r = Math.random();
        if (r < .55) { cls.add('bl'); setTimeout(() => cls.remove('bl'), 140); if (Math.random() < .2) setTimeout(() => { cls.add('bl'); setTimeout(() => cls.remove('bl'), 120); }, 260); }
        else if (r < .8 && now - lastPtr > 3000) { look((Math.random() - .5) * 3, (Math.random() - .5) * 1.6); setTimeout(() => { if (performance.now() - lastPtr > 3000) look(0, 0); }, 1400); }
        else { const t = Math.random() < .5 ? 'tilt-l' : 'tilt-r'; cls.add(t); setTimeout(() => cls.remove(t), 1600); }
      }
      setTimeout(idle, 1800 + Math.random() * 3400);
    };
    setTimeout(idle, 1500);
  }
  return { mood, gesture, react, look };
}

/* kontroler mimiki i gestów: HistadaFx(element z SVG) */
function HistadaFx(host) {
  const svg = host && host.querySelector('svg.hx');
  const noop = { mood() {}, gesture() {}, react() {}, look() {} };
  if (!svg) return noop;
  if (!document.getElementById('hx-css')) { const st = document.createElement('style'); st.id = 'hx-css'; st.textContent = HISTADA_CSS; document.head.appendChild(st); }
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOODS = ['happy', 'sad', 'think', 'wow'], GEST = { wave: 2200, point: 2400, think: 3200, clap: 1800, nod: 900, shake: 900 };
  let mT = null, gT = null, lastPtr = 0, busyUntil = 0;
  const cls = svg.classList;
  function mood(m, ms = 2800) {
    MOODS.forEach(x => cls.remove('m-' + x)); if (m) cls.add('m-' + m);
    clearTimeout(mT); if (m && ms) mT = setTimeout(() => mood(null), ms);
  }
  function gesture(gs) {
    if (RM || !GEST[gs]) return;
    Object.keys(GEST).forEach(x => cls.remove('g-' + x)); void svg.getBoundingClientRect(); cls.add('g-' + gs);
    busyUntil = performance.now() + GEST[gs];
    clearTimeout(gT); gT = setTimeout(() => cls.remove('g-' + gs), GEST[gs]);
  }
  function look(x, y) { svg.style.setProperty('--lx', x.toFixed(2) + 'px'); svg.style.setProperty('--ly', y.toFixed(2) + 'px'); }
  // gotowe reakcje na sytuacje w grze
  function react(kind) {
    switch (kind) {
      case 'hi': mood('happy', 2400); gesture('wave'); break;
      case 'ok': mood('happy', 2600); gesture(Math.random() < .6 ? 'clap' : 'nod'); break;
      case 'no': mood('sad', 2600); gesture('shake'); break;
      case 'q': mood('think', 0); if (Math.random() < .5) gesture('think'); break;
      case 'point': gesture('point'); break;
      case 'wow': mood('wow', 1800); break;
      case 'win': mood('happy', 4000); gesture('clap'); setTimeout(() => gesture('wave'), 1900); break;
      case 'calm': mood(null); break;
    }
  }
  if (!RM) {
    // oczy śledzą kursor
    let raf = 0, px = 0, py = 0;
    window.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; lastPtr = performance.now(); if (raf) return; raf = requestAnimationFrame(() => {
      raf = 0; if (cls.contains('m-think') || cls.contains('m-sad')) return;
      const r = host.getBoundingClientRect(); if (!r.width) return;
      const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height * .47), d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260);
      look(dx / d * 1.7 * k, dy / d * 1.3 * k); }); }, { passive: true });
    // życie w spoczynku: mruganie, rozglądanie się, przechylenie głowy
    const idle = () => {
      const now = performance.now();
      if (!document.hidden && now > busyUntil) {
        const r = Math.random();
        if (r < .55) { cls.add('bl'); setTimeout(() => cls.remove('bl'), 140); if (Math.random() < .2) setTimeout(() => { cls.add('bl'); setTimeout(() => cls.remove('bl'), 120); }, 260); }
        else if (r < .8 && now - lastPtr > 3000) { look((Math.random() - .5) * 3, (Math.random() - .5) * 1.6); setTimeout(() => { if (performance.now() - lastPtr > 3000) look(0, 0); }, 1400); }
        else { const t = Math.random() < .5 ? 'tilt-l' : 'tilt-r'; cls.add(t); setTimeout(() => cls.remove(t), 1600); }
      }
      setTimeout(idle, 1800 + Math.random() * 3400);
    };
    setTimeout(idle, 1500);
  }
  return { mood, gesture, react, look };
}
