<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/shared/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/shared/histada-core.css"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]{display:none!important}</style><script src="/shared/claude-shim.js"></script><script src="/shared/histada-core.js"></script></head><body>
<title>HISTADA do druku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Świadomie jeden, papierowy wygląd – jak arkusz z drukarni: kremowy karton, granatowy tusz, turkus planszy, złoto. */
:root{color-scheme:light;--paper:#f4efe3;--sheet:#fdfbf5;--ink:#15303a;--muted:#5e6f76;--line:#d9d1bd;--teal:#0d6c78;--gold:#b8902c;--kraft:#e8e3d6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--display:"Cinzel","Times New Roman",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:32px 56px;display:flex;flex-direction:column;gap:30px}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:18px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{margin:6px 0 8px;font:700 clamp(30px,5vw,48px)/1.05 var(--display);letter-spacing:.06em;text-wrap:balance}
.lede{margin:0;max-width:64ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:600 14px var(--sans);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--teal)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.all{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--ink);color:#fdfbf5;border-radius:10px;padding:18px 20px}
.all b{font:700 20px var(--display);letter-spacing:.04em;color:#f0d48f}
.all p{margin:4px 0 0;color:#d7dfe2;font-size:14px}
.all .ico{width:56px;height:56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.item{background:var(--sheet);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.item.wide{grid-column:1/-1;grid-template-rows:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.shot{background:var(--kraft);display:grid;place-items:center;padding:14px;min-height:200px;border-bottom:1px solid var(--line)}
.item.wide .shot{border-bottom:none;border-right:1px solid var(--line)}
.shot img{max-width:100%;max-height:230px;display:block;box-shadow:0 2px 0 rgba(0,0,0,.06),0 8px 22px rgba(21,48,58,.18);background:#fff}
.item.wide .shot img{max-height:340px}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.body h2{margin:0;font:700 21px/1.15 var(--display);letter-spacing:.03em}
.body p{margin:0;font-size:14.5px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.spec dt{font:500 12px var(--mono);color:var(--muted)}
.spec dd{margin:0}
.dl{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.dl button{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;padding:6px 10px}
.dl button small{font:500 11px var(--mono);color:var(--muted)}
.dl button.pri small{color:#cfe8eb}
.dl.pages{padding:8px;background:var(--paper);border-radius:8px;margin-top:0}
.dl button[aria-expanded=true]{border-color:var(--teal);background:#e6f1f2}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps li::before{content:counter(s);font:700 18px var(--display);color:var(--gold)}
.steps b{font-size:14.5px}
h3{margin:0 0 10px;font:700 20px var(--display);letter-spacing:.05em}
.note{font-size:13px;color:var(--muted);max-width:86ch;margin:0;border-left:2px solid var(--line);padding-left:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:760px){.item.wide{grid-template-columns:1fr}.item.wide .shot{border-right:none;border-bottom:1px solid var(--line)}.all{grid-template-columns:1fr}.all .ico{display:none}.grid{grid-template-columns:1fr}}
</style>

<main class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="tools"><select id="lang" aria-label="Język / Language"><option value="pl">PL</option><option value="en">EN</option></select></div>
  </header>

  <section class="all">
    <svg class="ico" viewBox="0 0 56 56" aria-hidden="true"><rect x="8" y="6" width="34" height="44" rx="3" fill="#fdfbf5"/><rect x="14" y="10" width="34" height="44" rx="3" fill="#f0d48f"/><path d="M31 22v16m-7-7l7 7 7-7" stroke="#15303a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b data-t="allT"></b><p data-t="allP"></p></div>
    <button class="pri" data-file="histada-zestaw-kompletny.pdf"></button>
  </section>

  <div class="grid" id="grid"></div>

  <section>
    <h3 data-t="howT"></h3>
    <ol class="steps" id="steps"></ol>
  </section>
  <p class="note" data-t="note"></p>
</main>

const FN = f => L !== 'en' ? f : f.includes('{nn}') ? f.replace('.pdf', '-en.pdf') : f.includes('{n}') ? f.replace('-{n}', '-en-{n}') : f.replace(/(\.\w+)$/, '-en$1');
const t = TXT[L], mb = f => { const b = SIZES[f] || 0; return b > 1e6 ? (b / 1e6).toFixed(1).replace('.', L === 'pl' ? ',' : '.') + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' kB'; };
document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
$('.all button').dataset.file = FN('histada-zestaw-kompletny.pdf'); $('.all button').innerHTML = `${esc(t.allB)} <small>${mb(FN('histada-zestaw-kompletny.pdf'))}</small>`;
$('#grid').innerHTML = ITEMS.map(it => { const x = it[L];
  return `<article class="item ${it.wide ? 'wide' : ''}"><div class="shot"><img src="${FN(it.thumb)}" alt="${esc(x[0])}" loading="lazy"></div>
    <div class="body"><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p>

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-pages]'); if (!b) return;
  const box = b.closest('.body').querySelector('.pages'), open = b.getAttribute('aria-expanded') === 'true' && box.dataset.src === b.dataset.pages;
  b.closest('.dl').querySelectorAll('[data-pages]').forEach(x => x.setAttribute('aria-expanded', 'false'));
  if (open) { box.hidden = true; return; }
  b.setAttribute('aria-expanded', 'true'); box.dataset.src = b.dataset.pages; box.hidden = false;
  box.innerHTML = Array.from({ length: +b.dataset.n }, (_, i) => { const nn = b.dataset.pages.includes('{nn}'), f = b.dataset.pages.replace('{n}', i + 1).replace('{nn}', String(i + 1).padStart(2, '0')); return `<button data-file="${f}">${nn ? t.ep : t.page} ${i + 1} <small>${mb(f)}</small></button>`; }).join('');
});

function toast(m) { document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-file]'); if (!b) return;
  const f = b.dataset.file;
  if (!DL) { const a = document.createElement('a'); a.href = f; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); return; }
  b.disabled = true;
  try { const r = await fetch(f); if (!r.ok) throw new Error(r.status); await DL.save({ filename: f, data: await r.blob() }); toast(t.saved + f); }
  catch (err) { if (!err || (err.code !== 'cancelled' && err.code !== 'declined')) toast(t.err); }
  finally { b.disabled = false; }
});
