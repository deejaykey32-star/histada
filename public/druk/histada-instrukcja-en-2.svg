<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="IBM Plex Sans" fill="#15303a"><text x="16" y="24" font-size="8" font-family="Cinzel" font-weight="700">How to print the set</text><rect x="16" y="36" width="178" height="8" fill="#15303a"/><text x="19" y="41.4" font-size="3" fill="#fff" font-weight="700">COMPONENT</text><text x="66" y="41.4" font-size="3" fill="#fff" font-weight="700">FORMAT</text><text x="116" y="41.4" font-size="3" fill="#fff" font-weight="700">PAPER AND NOTES</text><rect x="16" y="44" width="178" height="14.4" fill="#15303a" fill-opacity=".05"/><text x="19" y="49.2" font-size="3" font-weight="700">A1 board</text><text x="66" y="49.2" font-size="2.8" >1 sheet 841 × 594 mm</text><text x="116" y="49.2" font-size="2.8" >paper 120–170 g/m², ideally at a print</text><text x="116" y="53" font-size="2.8" >shop; or 8 × A4 to glue together</text><text x="116" y="56.8" font-size="2.8" >(version with glue margins)</text><text x="19" y="63.6" font-size="3" font-weight="700">Domain cards</text><text x="66" y="63.6" font-size="2.8" >8 A4 pages (fronts + backs)</text><text x="116" y="63.6" font-size="2.8" >card stock 250–300 g/m², double-sided,</text><text x="116" y="67.4" font-size="2.8" >flip on the long edge; cut along the</text><text x="116" y="71.2" font-size="2.8" >marks</text><rect x="16" y="72.8" width="178" height="10.6" fill="#15303a" fill-opacity=".05"/><text x="19" y="78" font-size="3" font-weight="700">Character sheets</text><text x="66" y="78" font-size="2.8" >12 A4 pages, landscape</text><text x="116" y="78" font-size="2.8" >card stock 200–250 g/m², double-sided;</text><text x="116" y="81.8" font-size="2.8" >front + cheat sheet on the back</text><text x="19" y="88.6" font-size="3" font-weight="700">Dice</text><text x="66" y="88.6" font-size="2.8" >1 A4 page</text><text x="116" y="88.6" font-size="2.8" >paper 200–250 g/m²; cut, fold, glue</text><text x="116" y="92.4" font-size="2.8" >the tabs</text><rect x="16" y="94" width="178" height="10.6" fill="#15303a" fill-opacity=".05"/><text x="19" y="99.2" font-size="3" font-weight="700">Pawns and tokens</text><text x="66" y="99.2" font-size="2.8" >1 A4 page</text><text x="116" y="99.2" font-size="2.8" >card stock 250–300 g/m²; tokens can be</text><text x="116" y="103" font-size="2.8" >glued onto 9–10 mm buttons</text><text x="19" y="109.8" font-size="3" font-weight="700">Card box</text><text x="66" y="109.8" font-size="2.8" >1 A4 page, landscape</text><text x="116" y="109.8" font-size="2.8" >card stock 250–300 g/m²</text><rect x="16" y="113.6" width="178" height="9" fill="#15303a" fill-opacity=".05"/><text x="19" y="118.8" font-size="3" font-weight="700">Score sheet</text><text x="66" y="118.8" font-size="2.8" >1 A4 page, landscape</text><text x="116" y="118.8" font-size="2.8" >plain paper, photocopiable</text><text x="19" y="127.8" font-size="3" font-weight="700">These rules</text><text x="66" y="127.8" font-size="2.8" >2 A4 pages</text><text x="116" y="127.8" font-size="2.8" >plain paper</text><text x="16" y="137.6" font-size="3" fill-opacity=".85">Always print at 100% scale (“actual size”, no fit to page) – then a card measures 89 × 57 mm</text><text x="16" y="142" font-size="3" fill-opacity=".85">and fits the slot on the character sheet, and a pawn's base fits the circle on a board field.</text><text x="16" y="154.4" font-size="5" font-family="Cinzel" font-weight="700">Nine intelligences</text><g transform="translate(16 158) scale(0.5)"><path d="M3.5 8.5a1.6 1.6 0 1 1 0-.01M5.1 8.3V1.6l3.6 1.1v1.7L5.1 3.3" fill="none" stroke="#c2185b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="161.4" font-size="3" font-weight="600">musical-rhythmic</text><text x="23" y="165.4" font-size="2.3" fill-opacity=".65">sound, rhythm, music, instruments</text><g transform="translate(76 158) scale(0.5)"><path d="M1 5c2-3.2 6-3.2 8 0c-2 3.2-6 3.2-8 0ZM5 3.8a1.2 1.2 0 1 0 .01 0" fill="none" stroke="#1e78c8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="161.4" font-size="3" font-weight="600">visual-spatial</text><text x="83" y="165.4" font-size="2.3" fill-opacity=".65">shapes, maps, images, space, architecture</text><g transform="translate(136 158) scale(0.5)"><path d="M1.5 1.8h7v4.6H4.2L2.2 8.4V6.4h-.7Z" fill="none" stroke="#795548" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="161.4" font-size="3" font-weight="600">verbal-linguistic</text><text x="143" y="165.4" font-size="2.3" fill-opacity=".65">words, concepts, texts, word origins</text><g transform="translate(16 170) scale(0.5)"><path d="M1.5 3.2h3M3 1.7v3M5.8 3.2h3M1.5 6.8h3M5.8 6.2h3M5.8 7.6h3" fill="none" stroke="#3949ab" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="173.4" font-size="3" font-weight="600">logical-mathematical</text><text x="23" y="177.4" font-size="2.3" fill-opacity=".65">numbers, dates, calculations, cause and effect</text><g transform="translate(76 170) scale(0.5)"><path d="M1 5h8M2.2 3v4M7.8 3v4M3.4 3.8v2.4M6.6 3.8v2.4" fill="none" stroke="#e65100" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="173.4" font-size="3" font-weight="600">bodily-kinesthetic</text><text x="83" y="177.4" font-size="2.3" fill-opacity=".65">movement, sport, crafts, tools, the body</text><g transform="translate(136 170) scale(0.5)"><path d="M3.4 2.3a1.2 1.2 0 1 0 .01 0M.9 8.6c0-2.1 5-2.1 5 0M7 2.2a1 1 0 1 0 .01 0M6.6 5.4c1.5-.3 2.7.5 2.7 2.2" fill="none" stroke="#00897b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="173.4" font-size="3" font-weight="600">interpersonal</text><text x="143" y="177.4" font-size="2.3" fill-opacity=".65">people, cooperation, agreements, communities</text><g transform="translate(16 182) scale(0.5)"><path d="M5 8.6L1.7 5.2a1.9 1.9 0 0 1 3.3-2.6a1.9 1.9 0 0 1 3.3 2.6Z" fill="none" stroke="#8e24aa" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="185.4" font-size="3" font-weight="600">intrapersonal</text><text x="23" y="189.4" font-size="2.3" fill-opacity=".65">reflection, self-knowledge, values, diaries and confessions</text><g transform="translate(76 182) scale(0.5)"><path d="M1.8 8.2C1.8 3.2 5 1.6 8.6 1.6c0 3.6-1.6 6.6-6.8 6.6ZM1.8 8.2L6 4" fill="none" stroke="#3f9142" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="185.4" font-size="3" font-weight="600">naturalistic</text><text x="83" y="189.4" font-size="2.3" fill-opacity=".65">nature, plants, animals, classification</text><g transform="translate(136 182) scale(0.5)"><path d="M5 1l1.2 2.8 2.8.3-2.1 1.9.6 2.9L5 7.4 2.5 8.9l.6-2.9L1 4.1l2.8-.3Z" fill="none" stroke="#b58900" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="185.4" font-size="3" font-weight="600">existential</text><text x="143" y="189.4" font-size="2.3" fill-opacity=".65">meaning, faith, ultimate questions, the cosmos</text><text x="16" y="201.4" font-size="5" font-family="Cinzel" font-weight="700">Epochs (white d12)</text><text x="16" y="207.4" font-size="3" font-weight="600">1. Beginning of the Universe</text><text x="66" y="207.4" font-size="2.4" fill-opacity=".65">13.8 bn years ago – 4.5 bn years ago</text><text x="16" y="213.6" font-size="3" font-weight="600">2. Beginning of the Earth</text><text x="66" y="213.6" font-size="2.4" fill-opacity=".65">4.5 bn years ago – 5 m years ago</text><text x="16" y="219.8" font-size="3" font-weight="600">3. Prehistory</text><text x="66" y="219.8" font-size="2.4" fill-opacity=".65">5 m years ago – 5000 BC</text><text x="16" y="226" font-size="3" font-weight="600">4. Antiquity</text><text x="66" y="226" font-size="2.4" fill-opacity=".65">5000 BC – 500 AD</text><text x="16" y="232.2" font-size="3" font-weight="600">5. Middle Ages</text><text x="66" y="232.2" font-size="2.4" fill-opacity=".65">500–1500 AD</text><text x="16" y="238.4" font-size="3" font-weight="600">6. Renaissance – Age of Discovery</text><text x="66" y="238.4" font-size="2.4" fill-opacity=".65">1500–1800 AD</text><text x="108" y="207.4" font-size="3" font-weight="600">7. Industrial Revolution</text><text x="158" y="207.4" font-size="2.4" fill-opacity=".65">1800–1900 AD</text><text x="108" y="213.6" font-size="3" font-weight="600">8. Era of the World Wars</text><text x="158" y="213.6" font-size="2.4" fill-opacity=".65">1900–1950 AD</text><text x="108" y="219.8" font-size="3" font-weight="600">9. Cold War</text><text x="158" y="219.8" font-size="2.4" fill-opacity=".65">1950–1990 AD</text><text x="108" y="226" font-size="3" font-weight="600">10. Digital Age</text><text x="158" y="226" font-size="2.4" fill-opacity=".65">1990–2020 AD</text><text x="108" y="232.2" font-size="3" font-weight="600">11. Present Day</text><text x="158" y="232.2" font-size="2.4" fill-opacity=".65">2020–2025 AD</text><text x="108" y="238.4" font-size="3" font-weight="600">12. Future</text><text x="158" y="238.4" font-size="2.4" fill-opacity=".65">2025 AD – end of time</text><text x="105" y="292" font-size="2.6" text-anchor="middle" fill="#555">HISTADA · rules · page 2/2</text></svg>