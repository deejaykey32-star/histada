<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="IBM Plex Sans" fill="#15303a"><text x="16" y="24" font-size="8" font-family="Cinzel" font-weight="700">Jak wydrukować zestaw</text><rect x="16" y="36" width="178" height="8" fill="#15303a"/><text x="19" y="41.4" font-size="3" fill="#fff" font-weight="700">ELEMENT</text><text x="66" y="41.4" font-size="3" fill="#fff" font-weight="700">FORMAT</text><text x="116" y="41.4" font-size="3" fill="#fff" font-weight="700">PAPIER I UWAGI</text><rect x="16" y="44" width="178" height="18.2" fill="#15303a" fill-opacity=".05"/><text x="19" y="49.2" font-size="3" font-weight="700">Plansza A1</text><text x="66" y="49.2" font-size="2.8" >1 arkusz 841 × 594 mm</text><text x="116" y="49.2" font-size="2.8" >papier 120–170 g/m², najlepiej w</text><text x="116" y="53" font-size="2.8" >punkcie ksero; albo 8 × A4 do</text><text x="116" y="56.8" font-size="2.8" >sklejenia (wersja z marginesami na</text><text x="116" y="60.6" font-size="2.8" >klej)</text><text x="19" y="67.4" font-size="3" font-weight="700">Karty dziedzin</text><text x="66" y="67.4" font-size="2.8" >8 stron A4 (awers + rewers)</text><text x="116" y="67.4" font-size="2.8" >karton 250–300 g/m², druk dwustronny,</text><text x="116" y="71.2" font-size="2.8" >odwracanie wzdłuż dłuższej krawędzi;</text><text x="116" y="75" font-size="2.8" >tnij po znacznikach</text><rect x="16" y="76.6" width="178" height="10.6" fill="#15303a" fill-opacity=".05"/><text x="19" y="81.8" font-size="3" font-weight="700">Kartoniki postaci</text><text x="66" y="81.8" font-size="2.8" >12 stron A4 poziomo</text><text x="116" y="81.8" font-size="2.8" >karton 200–250 g/m², druk dwustronny;</text><text x="116" y="85.6" font-size="2.8" >przód + ściąga z tyłu</text><text x="19" y="92.4" font-size="3" font-weight="700">Kości</text><text x="66" y="92.4" font-size="2.8" >1 strona A4</text><text x="116" y="92.4" font-size="2.8" >papier 200–250 g/m²; wytnij, zegnij,</text><text x="116" y="96.2" font-size="2.8" >sklej zakładki</text><rect x="16" y="97.8" width="178" height="10.6" fill="#15303a" fill-opacity=".05"/><text x="19" y="103" font-size="3" font-weight="700">Pionki i żetony</text><text x="66" y="103" font-size="2.8" >1 strona A4</text><text x="116" y="103" font-size="2.8" >karton 250–300 g/m²; żetony można</text><text x="116" y="106.8" font-size="2.8" >nakleić na guziki 9–10 mm</text><text x="19" y="113.6" font-size="3" font-weight="700">Pudełko na karty</text><text x="66" y="113.6" font-size="2.8" >1 strona A4 poziomo</text><text x="116" y="113.6" font-size="2.8" >karton 250–300 g/m²</text><rect x="16" y="117.4" width="178" height="9" fill="#15303a" fill-opacity=".05"/><text x="19" y="122.6" font-size="3" font-weight="700">Tabela wyników</text><text x="66" y="122.6" font-size="2.8" >1 strona A4 poziomo</text><text x="116" y="122.6" font-size="2.8" >zwykły papier, do kopiowania</text><text x="19" y="131.6" font-size="3" font-weight="700">Ta instrukcja</text><text x="66" y="131.6" font-size="2.8" >2 strony A4</text><text x="116" y="131.6" font-size="2.8" >zwykły papier</text><text x="16" y="141.4" font-size="3" fill-opacity=".85">Drukuj zawsze w skali 100% („rzeczywisty rozmiar”, bez dopasowania do strony) – wtedy karta ma</text><text x="16" y="145.8" font-size="3" fill-opacity=".85">89 × 57 mm i pasuje do pola na kartoniku, a stopka pionka do kółka na polu planszy.</text><text x="16" y="158.2" font-size="5" font-family="Cinzel" font-weight="700">Dziewięć inteligencji</text><g transform="translate(16 161.8) scale(0.5)"><path d="M3.5 8.5a1.6 1.6 0 1 1 0-.01M5.1 8.3V1.6l3.6 1.1v1.7L5.1 3.3" fill="none" stroke="#c2185b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="165.2" font-size="3" font-weight="600">muzyczno-rytmiczna</text><text x="23" y="169.2" font-size="2.3" fill-opacity=".65">dźwięk, rytm, muzyka, instrumenty</text><g transform="translate(76 161.8) scale(0.5)"><path d="M1 5c2-3.2 6-3.2 8 0c-2 3.2-6 3.2-8 0ZM5 3.8a1.2 1.2 0 1 0 .01 0" fill="none" stroke="#1e78c8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="165.2" font-size="3" font-weight="600">wizualno-przestrzenna</text><text x="83" y="169.2" font-size="2.3" fill-opacity=".65">kształty, mapy, obrazy, przestrzeń, architektura</text><g transform="translate(136 161.8) scale(0.5)"><path d="M1.5 1.8h7v4.6H4.2L2.2 8.4V6.4h-.7Z" fill="none" stroke="#795548" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="165.2" font-size="3" font-weight="600">werbalno-językowa</text><text x="143" y="169.2" font-size="2.3" fill-opacity=".65">słowa, pojęcia, teksty, pochodzenie wyrazów</text><g transform="translate(16 173.8) scale(0.5)"><path d="M1.5 3.2h3M3 1.7v3M5.8 3.2h3M1.5 6.8h3M5.8 6.2h3M5.8 7.6h3" fill="none" stroke="#3949ab" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="177.2" font-size="3" font-weight="600">logiczno-matematyczna</text><text x="23" y="181.2" font-size="2.3" fill-opacity=".65">liczby, daty, obliczenia, przyczyna i skutek</text><g transform="translate(76 173.8) scale(0.5)"><path d="M1 5h8M2.2 3v4M7.8 3v4M3.4 3.8v2.4M6.6 3.8v2.4" fill="none" stroke="#e65100" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="177.2" font-size="3" font-weight="600">cielesno-kinestetyczna</text><text x="83" y="181.2" font-size="2.3" fill-opacity=".65">ruch, sport, rzemiosło, narzędzia, ciało</text><g transform="translate(136 173.8) scale(0.5)"><path d="M3.4 2.3a1.2 1.2 0 1 0 .01 0M.9 8.6c0-2.1 5-2.1 5 0M7 2.2a1 1 0 1 0 .01 0M6.6 5.4c1.5-.3 2.7.5 2.7 2.2" fill="none" stroke="#00897b" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="177.2" font-size="3" font-weight="600">interpersonalna</text><text x="143" y="181.2" font-size="2.3" fill-opacity=".65">ludzie, współpraca, umowy, społeczności</text><g transform="translate(16 185.8) scale(0.5)"><path d="M5 8.6L1.7 5.2a1.9 1.9 0 0 1 3.3-2.6a1.9 1.9 0 0 1 3.3 2.6Z" fill="none" stroke="#8e24aa" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="23" y="189.2" font-size="3" font-weight="600">intrapersonalna</text><text x="23" y="193.2" font-size="2.3" fill-opacity=".65">refleksja, samopoznanie, wartości, dzienniki i wyznania</text><g transform="translate(76 185.8) scale(0.5)"><path d="M1.8 8.2C1.8 3.2 5 1.6 8.6 1.6c0 3.6-1.6 6.6-6.8 6.6ZM1.8 8.2L6 4" fill="none" stroke="#3f9142" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="189.2" font-size="3" font-weight="600">przyrodnicza</text><text x="83" y="193.2" font-size="2.3" fill-opacity=".65">natura, rośliny, zwierzęta, klasyfikacja</text><g transform="translate(136 185.8) scale(0.5)"><path d="M5 1l1.2 2.8 2.8.3-2.1 1.9.6 2.9L5 7.4 2.5 8.9l.6-2.9L1 4.1l2.8-.3Z" fill="none" stroke="#b58900" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></g><text x="143" y="189.2" font-size="3" font-weight="600">egzystencjalna</text><text x="143" y="193.2" font-size="2.3" fill-opacity=".65">sens, wiara, pytania ostateczne, kosmos</text><text x="16" y="205.2" font-size="5" font-family="Cinzel" font-weight="700">Epoki (biała k12)</text><text x="16" y="211.2" font-size="3" font-weight="600">1. Początek wszechświata</text><text x="66" y="211.2" font-size="2.4" fill-opacity=".65">13,8 mld lat temu – 4,5 mld lat temu</text><text x="16" y="217.4" font-size="3" font-weight="600">2. Początek Ziemi</text><text x="66" y="217.4" font-size="2.4" fill-opacity=".65">4,5 mld lat temu – 5 mln lat temu</text><text x="16" y="223.6" font-size="3" font-weight="600">3. Prehistoria</text><text x="66" y="223.6" font-size="2.4" fill-opacity=".65">5 mln lat temu – 5000 p.n.e.</text><text x="16" y="229.8" font-size="3" font-weight="600">4. Starożytność</text><text x="66" y="229.8" font-size="2.4" fill-opacity=".65">5000 p.n.e. – 500 r.</text><text x="16" y="236" font-size="3" font-weight="600">5. Średniowiecze</text><text x="66" y="236" font-size="2.4" fill-opacity=".65">500–1500 r.</text><text x="16" y="242.2" font-size="3" font-weight="600">6. Renesans – odkrycia geograficzne</text><text x="66" y="242.2" font-size="2.4" fill-opacity=".65">1500–1800 r.</text><text x="108" y="211.2" font-size="3" font-weight="600">7. Rewolucja przemysłowa</text><text x="158" y="211.2" font-size="2.4" fill-opacity=".65">1800–1900 r.</text><text x="108" y="217.4" font-size="3" font-weight="600">8. Okres dwóch wojen światowych</text><text x="158" y="217.4" font-size="2.4" fill-opacity=".65">1900–1950 r.</text><text x="108" y="223.6" font-size="3" font-weight="600">9. Zimna wojna</text><text x="158" y="223.6" font-size="2.4" fill-opacity=".65">1950–1990 r.</text><text x="108" y="229.8" font-size="3" font-weight="600">10. Cyfryzacja</text><text x="158" y="229.8" font-size="2.4" fill-opacity=".65">1990–2020 r.</text><text x="108" y="236" font-size="3" font-weight="600">11. Współczesność</text><text x="158" y="236" font-size="2.4" fill-opacity=".65">2020–2025 r.</text><text x="108" y="242.2" font-size="3" font-weight="600">12. Przyszłość</text><text x="158" y="242.2" font-size="2.4" fill-opacity=".65">2025 r. – koniec czasu</text><text x="105" y="292" font-size="2.6" text-anchor="middle" fill="#555">HISTADA · instrukcja · strona 2/2</text></svg>