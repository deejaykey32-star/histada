<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="IBM Plex Sans" fill="#15303a"><rect width="210" height="46" fill="#15303a"/><text x="16" y="22" font-size="13" font-family="Cinzel" font-weight="700" fill="#fff" letter-spacing="1">HISTADA</text><text x="16" y="31" font-size="3.6" fill="#c9a23a" font-weight="700" letter-spacing=".4">Trylogia · część 1 · Rozgrywka planszowa · instrukcja</text><text x="16" y="38.5" font-size="3" fill="#fff" fill-opacity=".8">Gra edukacyjna dla 1–12 graczy od ok. 10 lat · czas: 30–120 min</text><text x="16" y="58" font-size="4.2" font-family="Cinzel" font-weight="700">Cel gry</text><text x="16" y="64" font-size="3.1" >Podróżujesz przez czas i przestrzeń. Każda</text><text x="16" y="68.6" font-size="3.1" >poprawna odpowiedź daje 10 punktów w jednej</text><text x="16" y="73.2" font-size="3.1" >z dziewięciu inteligencji. Wygrywa, kto</text><text x="16" y="77.8" font-size="3.1" >pierwszy osiągnie ustalony cel (np. 1000</text><text x="16" y="82.4" font-size="3.1" >albo 10 000 punktów) – rundę dokańczają</text><text x="16" y="87" font-size="3.1" >wszyscy, żeby każdy miał tyle samo tur.</text><text x="16" y="96.6" font-size="4.2" font-family="Cinzel" font-weight="700">Elementy</text><text x="16" y="102.6" font-size="3.1" >Plansza (mapa świata A1 albo 8 arkuszy A4),</text><text x="16" y="107.2" font-size="3.1" >36 kart dziedzin z pudełkiem, 12 kartoników</text><text x="16" y="111.8" font-size="3.1" >postaci, kości: biała k12, czarna k12, dwie</text><text x="16" y="116.4" font-size="3.1" >szare k6, 12 pionków lub żetonów, tabela</text><text x="16" y="121" font-size="3.1" >wyników, znacznik pierwszego gracza.</text><text x="16" y="130.6" font-size="4.2" font-family="Cinzel" font-weight="700">Przygotowanie</text><text x="16" y="136.6" font-size="3.1" >Każdy gracz wybiera postać i bierze jej</text><text x="16" y="141.2" font-size="3.1" >kartonik oraz pionek. Pionki stoją na polach</text><text x="16" y="145.8" font-size="3.1" >START (numery graczy przy krawędzi mapy).</text><text x="16" y="150.4" font-size="3.1" >Potasuj karty dziedzin i połóż zakryte na</text><text x="16" y="155" font-size="3.1" >polu TALIA KART. Ustalcie cel punktowy albo</text><text x="16" y="159.6" font-size="3.1" >limit czasu.</text><text x="16" y="169.2" font-size="4.2" font-family="Cinzel" font-weight="700">Pytania</text><text x="16" y="175.2" font-size="3.1" >Pytania wyświetla aplikacja HISTADA (część</text><text x="16" y="179.8" font-size="3.1" >1, tryb planszy fizycznej): wpisz lub</text><text x="16" y="184.4" font-size="3.1" >zeskanuj pole, kości i kartę. Aplikacja</text><text x="16" y="189" font-size="3.1" >dobiera 9 pytań do miejsca, epoki,</text><text x="16" y="193.6" font-size="3.1" >przedziału czasu i dziedziny, czyta je na</text><text x="16" y="198.2" font-size="3.1" >głos i liczy punkty.</text><text x="109" y="58" font-size="4.2" font-family="Cinzel" font-weight="700">Tura gracza</text><text x="109" y="64" font-size="3.1" >1. Rzuć wszystkimi kośćmi. Biała k12 wybiera</text><text x="109" y="68.6" font-size="3.1" >epokę (od Początku wszechświata do</text><text x="109" y="73.2" font-size="3.1" >Przyszłości), czarna k12 – jeden z 12</text><text x="109" y="77.8" font-size="3.1" >przedziałów czasu tej epoki, a suma szarych</text><text x="109" y="82.4" font-size="3.1" >k6 – największą liczbę pól ruchu. 2. Przesuń</text><text x="109" y="87" font-size="3.1" >pionek o najwyżej tyle pól. W pierwszej</text><text x="109" y="91.6" font-size="3.1" >turze stawiasz pionek na dowolnym polu lądu.</text><text x="109" y="96.2" font-size="3.1" >3. Dobierz kartę dziedziny i połóż ją na</text><text x="109" y="100.8" font-size="3.1" >kartoniku. 4. Odpowiedz na 9 pytań – po</text><text x="109" y="105.4" font-size="3.1" >jednym dla każdej inteligencji.</text><text x="109" y="115" font-size="4.2" font-family="Cinzel" font-weight="700">Porty i morze</text><text x="109" y="121" font-size="3.1" >Pola z symbolem łódki to porty. Przerywane</text><text x="109" y="125.6" font-size="3.1" >linie to szybkie trasy morskie: rejs między</text><text x="109" y="130.2" font-size="3.1" >połączonymi portami liczy się jak jeden krok</text><text x="109" y="134.8" font-size="3.1" >ruchu.</text><text x="109" y="144.4" font-size="4.2" font-family="Cinzel" font-weight="700">Punkty</text><text x="109" y="150.4" font-size="3.1" >Za każdą dobrą odpowiedź dopisz 10 punktów w</text><text x="109" y="155" font-size="3.1" >rzędzie danej inteligencji i w rzędzie sumy</text><text x="109" y="159.6" font-size="3.1" >(kółka zębate na kartoniku albo tabela</text><text x="109" y="164.2" font-size="3.1" >wyników). Poziomy w każdej inteligencji:</text><text x="109" y="168.8" font-size="3.1" >Nowicjusz 10+, Adept 50+, Znawca 150+,</text><text x="109" y="173.4" font-size="3.1" >Mistrz 300+, Arcymistrz 600+.</text><text x="109" y="183" font-size="4.2" font-family="Cinzel" font-weight="700">Koniec gry</text><text x="109" y="189" font-size="3.1" >Gdy ktoś osiągnie cel, dokończcie rundę.</text><text x="109" y="193.6" font-size="3.1" >Wygrywa najwyższa suma. Aplikacja wystawi</text><text x="109" y="198.2" font-size="3.1" >każdemu certyfikat PDF z poziomem dziewięciu</text><text x="109" y="202.8" font-size="3.1" >inteligencji.</text><text x="105" y="292" font-size="2.6" text-anchor="middle" fill="#555">HISTADA · instrukcja · strona 1/2</text></svg>